<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SignAI Live Prediction</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <h1>SignAI Live Classifier</h1>
    
    <div class="controls">
        <button onclick="startCamera()">Start Camera</button>
        <button onclick="stopCamera()">Stop Camera</button>
        <label for="model-version">Model Version:</label>
        <select id="model-version">
            {% for version in model_versions %}
            <option value="{{ version }}" {% if version == default_model_version %}selected{% endif %}>v{{ version }}</option>
            {% endfor %}
        </select>
        <label class="toggle-switch">
            <input type="checkbox" id="debug-toggle" onchange="toggleDebug()">
            <span class="slider"></span>
            Debug Mode
        </label>
    </div>

    <div class="app-layout">
        <!-- Main Video Area -->
        <div id="container">
            <video id="video" width="640" height="480" autoplay playsinline></video>
            <canvas id="landmarks" width="640" height="480" style="position:absolute; top:0; left:0; pointer-events:none;"></canvas>
            
            <div id="overlay">
                <div id="result">Waiting...</div>
                <div id="confidence"></div>
            </div>
        </div>

        <!-- Debug Area -->
        <div id="debug-panel" style="display:none;">
            <h3>Debug Center</h3>
            
            <div class="debug-grid">
                <!-- Visuals -->
                <div class="debug-col">
                    <div class="debug-card">
                        <h4>Hand Cutout</h4>
                        <img id="hand-cutout" alt="No Hand">
                    </div>
                </div>

                <!-- Stats -->
                <div class="debug-col">
                     <div class="debug-card">
                        <h4>Performance</h4>
                        <ul id="timing-stats" class="stats-list">
                            <li>Waiting for data...</li>
                        </ul>
                    </div>
                    <div class="debug-card">
                        <h4>Hand Meta</h4>
                        <ul id="meta-stats" class="stats-list">
                            <li>-</li>
                        </ul>
                    </div>
                </div>
            </div>

            <div class="debug-card full-width">
                <h4>Top 5 Predictions</h4>
                <div id="top5-list"></div>
            </div>
        </div>
    </div>
    
    <div id="status">Ready</div>

    <!-- Hidden canvas to capture frames -->
    <canvas id="canvas" width="640" height="480" style="display:none;"></canvas>

    <!-- Sign Dictionary Section -->
    <div id="dictionary-section">
        <h2>Sign Language Dictionary</h2>
        <div class="dictionary-grid">
            {% for label in labels %}
            <div class="sign-card">
                <div class="sign-image">
                    <img src="{{ url_for('dataset_img', label=label) }}" alt="Sign for {{ label }}" loading="lazy">
                </div>
                <div class="sign-label">{{ label }}</div>
            </div>
            {% endfor %}
        </div>
    </div>

    <!-- Load main.js-->
    <script src="{{ url_for('static', filename='main.js') }}"></script>
</body>
</html>
